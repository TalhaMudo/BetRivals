<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "BetRivals - Football Analytics" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
            background: #0a0e14;
            min-height: 100vh;
            color: #e8e8e8;
            position: relative;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("{{ url_for('static', filename='stadium.jpg') }}") center center/cover no-repeat;
            opacity: 0.12;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* ====== ANIMATIONS ====== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes smoothFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(46, 204, 113, 0);
            }
            50% {
                box-shadow: 0 0 30px rgba(46, 204, 113, 0.2);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
            }
        }

        /* ====== HEADER ====== */
        header {
            background: rgba(15, 20, 25, 0.92);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid #2ecc71;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.3rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: -0.5px;
            animation: slideInLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        h1 span {
            font-size: 2.4rem;
            animation: smoothFloat 3s ease-in-out infinite;
        }

        h1:hover {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        nav {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
            animation: slideInRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        nav a {
            padding: 0.7rem 1.3rem;
            color: #e8e8e8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(46, 204, 113, 0.3);
            background: rgba(46, 204, 113, 0.05);
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.2) 0%, rgba(46, 204, 113, 0.1) 100%);
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            border-radius: 8px;
        }

        nav a:hover {
            color: #2ecc71;
            border: 1.5px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
            transform: translateY(-3px);
        }

        nav a:hover::before {
            left: 0;
        }

        /* ====== MAIN CONTENT ====== */
        main {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem 4rem;
        }

        .hero-section {
            background: rgba(15, 20, 25, 0.85);
            border-radius: 16px;
            padding: 3.5rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(46, 204, 113, 0.25);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hero-section h2 {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .hero-section p {
            color: #c0c0c0;
            font-size: 1.1rem;
            line-height: 1.8;
            max-width: 700px;
        }

        .dataset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .dataset-card {
            background: rgba(15, 20, 25, 0.8);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(46, 204, 113, 0.2);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        .dataset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dataset-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 60px rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            background: rgba(15, 20, 25, 0.9);
        }

        .dataset-card:hover::before {
            transform: scaleX(1);
        }

        .dataset-card h3 {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 700;
        }

        .dataset-card .description {
            color: #b8b8b8;
            margin-bottom: 1.5rem;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .stats-badge {
            display: inline-block;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #0f1419;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            letter-spacing: 0.3px;
        }

        /* ====== TEAM SECTION ====== */
        .team-section {
            background: rgba(15, 20, 25, 0.85);
            border-radius: 16px;
            padding: 3rem;
            margin-top: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(46, 204, 113, 0.25);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .team-section h2 {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .team-member {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #0f1419;
            padding: 1.8rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 35px rgba(46, 204, 113, 0.35);
            letter-spacing: 0.3px;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .team-member:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 20px 50px rgba(46, 204, 113, 0.5);
        }

        /* ====== CONTENT SECTION ====== */
        .content-section {
            background: rgba(15, 20, 25, 0.85);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(46, 204, 113, 0.25);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .content-section h3 {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .content-section p,
        .content-section ul {
            color: #b8b8b8;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .content-section ul {
            padding-left: 2rem;
        }

        .content-section li {
            margin-bottom: 0.8rem;
            color: #b8b8b8;
        }

        /* ====== FOOTER ====== */
        footer {
            background: rgba(15, 20, 25, 0.92);
            padding: 2.5rem;
            text-align: center;
            margin-top: 4rem;
            border-top: 2px solid #2ecc71;
            animation: fadeInUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        footer p {
            color: #9ca3af;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }

        hr {
            display: none;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 1024px) {
            .header-content {
                flex-wrap: wrap;
                gap: 1.5rem;
            }

            h1 {
                order: 1;
                width: 100%;
                margin-bottom: 0.5rem;
            }

            nav {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            main {
                padding: 0 1.5rem 3rem;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            nav a {
                padding: 0.55rem 1rem;
                font-size: 0.85rem;
            }

            .hero-section,
            .team-section,
            .content-section {
                padding: 2rem;
            }

            .hero-section h2 {
                font-size: 1.8rem;
            }

            .dataset-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
                gap: 0.4rem;
            }

            h1 span {
                font-size: 1.8rem;
            }

            nav {
                gap: 0.3rem;
            }

            nav a {
                padding: 0.5rem 0.8rem;
                font-size: 0.75rem;
            }

            main {
                padding: 0 1rem 2rem;
            }

            .hero-section,
            .team-section,
            .content-section {
                padding: 1.5rem;
            }

            .hero-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <h1><span>🏆</span> BetRivals</h1>
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('talha') }}">Players</a>
                <a href="/shots">Shots</a>
                <a href="{{ url_for('matches') }}">Matches</a>
                <a href="{{ url_for('teams_page') }}">Teams</a>
                <a href="{{ url_for('seasons_page') }}">Seasons</a>
                <a href="/admin">Login</a>
                <a href="/register">Register</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 BetRivals Team | Advanced Football Analytics</p>
    </footer>
    {% block scripts %}{% endblock %}

</body>

</html>
