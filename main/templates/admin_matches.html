{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='admin_matches.css') }}">

<div class="matches-admin-container">
    <div class="admin-header">
        <h2>⚽ Matches Management</h2>
        <button class="btn-add" onclick="openCreateModal()">+ Add Match</button>
    </div>

    <div id="alert" class="alert"></div>

    <div class="filters-section">
        <input type="text" id="filterTeam" class="filter-input" placeholder="Filter by team..." onkeyup="loadMatches()">
        <select id="filterSeason" class="filter-input" onchange="loadMatches()">
            <option value="">Any Season</option>
        </select>
        <button class="btn-add" onclick="loadMatches()">🔄 Refresh</button>
    </div>

    <div class="matches-table" id="matchesTableWrap">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Season</th>
                        <th>Date</th>
                        <th>Home</th>
                        <th>Score</th>
                        <th>Away</th>
                        <th>League</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="matchesTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="paginationContainer" class="pagination"></div>
</div>

<!-- Create / Edit Modal -->
<div id="matchModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Match</h3>
            <button class="close-modal" onclick="closeModal()">×</button>
        </div>
        <form id="matchForm" onsubmit="saveMatch(event)">
            <div class="form-grid">
                <div class="form-group"><label>match_id</label><input id="field_match_id" name="match_id" type="number" /></div>
                <div class="form-group"><label>date</label><input id="field_date" name="date" type="datetime-local" /></div>
                <div class="form-group"><label>season</label><input id="field_season" name="season" type="number" /></div>
                <div class="form-group"><label>league</label><input id="field_league" name="league" type="text" /></div>
                <div class="form-group"><label>team_h</label><input id="field_team_h" name="team_h" type="text" /></div>
                <div class="form-group"><label>team_a</label><input id="field_team_a" name="team_a" type="text" /></div>
                <div class="form-group"><label>h_goals</label><input id="field_h_goals" name="h_goals" type="number" /></div>
                <div class="form-group"><label>a_goals</label><input id="field_a_goals" name="a_goals" type="number" /></div>
                <div class="form-group"><label>h_xg</label><input id="field_h_xg" name="h_xg" type="number" step="0.01" /></div>
                <div class="form-group"><label>a_xg</label><input id="field_a_xg" name="a_xg" type="number" step="0.01" /></div>
            </div>

            <div class="form-buttons">
                <button id="submitBtn" class="btn-submit">Add Match</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='admin_matches.js') }}"></script>

{% endblock %}
