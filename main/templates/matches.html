{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='matches.css') }}">
<!-- Flatpickr calendar picker CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">

<div class="matches-container">
    <div class="hero">
        <h2><span class="emoji">⚽</span> Match Visualizer & Search</h2>
    </div>

    <div class="search-card">
        <form id="searchForm">
            <div class="search-row">
                <div class="form-group search-input-group">
                    <label for="q">Search</label>
                    <div class="autocomplete-wrapper">
                        <input id="q" type="text" placeholder="Team name or match ID..." autocomplete="off" />
                        <ul id="teamAutocomplete" class="autocomplete-list"></ul>
                    </div>
                </div>

                <div class="button-group search-actions">
                    <button id="btn_search" type="button" class="search-button">🔍</button>
                    <button id="btn_toggle_advanced" type="button" class="reset-button small">Advanced Filters</button>
                    <button id="btn_reset" type="button" class="reset-button small">Reset</button>
                </div>
            </div>

            <div id="advancedFilters" class="search-form filters-grid" style="display:none; margin-top:16px;">
                <div class="form-group">
                    <label for="season">Season</label>
                    <select id="season"></select>
                </div>

                <div class="form-group">
                    <label for="date_from">Date From</label>
                    <input id="date_from" type="date" placeholder="Any" />
                </div>

                <div class="form-group">
                    <label for="date_to">Date To</label>
                    <input id="date_to" type="date" placeholder="Any" />
                </div>

                <div class="form-group">
                    <label for="min_goals">Min Goals</label>
                    <input id="min_goals" type="number" min="0" placeholder="0" />
                </div>

                <div class="form-group">
                    <label for="max_goals">Max Goals</label>
                    <input id="max_goals" type="number" min="0" placeholder="10" />
                </div>

                <div class="form-group">
                    <label for="min_xg">Min xG</label>
                    <input id="min_xg" type="number" step="0.1" min="0" placeholder="0" />
                </div>

                <div class="form-group">
                    <label for="team_home">Home Team</label>
                    <select id="team_home"></select>
                </div>

                <div class="form-group">
                    <label for="team_away">Away Team</label>
                    <select id="team_away"></select>
                </div>
            </div>
        </form>
    </div>

    <div id="results"></div>
</div>

<!-- Flatpickr Library -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="{{ url_for('static', filename='matches.js') }}"></script>

{% endblock %}
