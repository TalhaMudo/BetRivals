{% extends 'base.html' %}

{% block title %}{{ error }} - BetRivals{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">{{ error }}</h1>
        <p class="error-message">{{ message }}</p>
        <div class="error-actions">
            <a href="/" class="btn-home">Back to Home</a>
            <button onclick="history.back()" class="btn-back">Go Back</button>
        </div>
    </div>
</div>

<style>
.error-container {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.error-card {
    background: linear-gradient(145deg, rgba(15, 20, 25, 0.98), rgba(10, 14, 18, 0.95));
    border: 1px solid rgba(231, 76, 60, 0.3);
    border-radius: 16px;
    padding: 3rem;
    text-align: center;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

.error-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
}

.error-title {
    color: #e74c3c;
    font-size: 1.8rem;
    margin-bottom: 1rem;
    font-weight: 600;
}

.error-message {
    color: #999;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
    word-break: break-word;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-home, .btn-back {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
}

.btn-home {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    border: none;
}

.btn-home:hover {
    background: linear-gradient(135deg, #27ae60, #219a52);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
}

.btn-back {
    background: transparent;
    color: #aaa;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-back:hover {
    border-color: rgba(255, 255, 255, 0.4);
    color: #fff;
}
</style>
{% endblock %}
