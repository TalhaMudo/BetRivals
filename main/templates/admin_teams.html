{% extends "admin.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Manage Teams</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Team Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="teams-table">
            {% for t in teams %}
            <tr data-id="{{ t.team_id }}">
                <td>{{ t.team_id }}</td>
                <td><input class="form-control form-control-sm" value="{{ t.team_name }}" /></td>
                <td>
                    <button class="btn btn-sm btn-success update-btn">Update</button>
                    <button class="btn btn-sm btn-danger delete-btn">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <hr>
    <div class="mt-3">
        <input id="new-team-name" class="form-control" placeholder="New team name" />
        <button id="add-team" class="btn btn-primary mt-2">Add Team</button>
    </div>
</div>

<script>
    document.getElementById("add-team").onclick = async () => {
        const name = document.getElementById("new-team-name").value.trim();
        if (!name) return alert("Enter a team name");
        await fetch("/api/admin/teams", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team_name: name })
        });
        location.reload();
    };

    document.querySelectorAll(".update-btn").forEach(btn => btn.onclick = async e => {
        const tr = e.target.closest("tr");
        const id = tr.dataset.id;
        const name = tr.querySelector("input").value.trim();
        await fetch(`/api/admin/teams/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team_name: name })
        });
        alert("Updated!");
    });

    document.querySelectorAll(".delete-btn").forEach(btn => btn.onclick = async e => {
        if (!confirm("Delete this team?")) return;
        const tr = e.target.closest("tr");
        const id = tr.dataset.id;
        await fetch(`/api/admin/teams/${id}`, { method: "DELETE" });
        tr.remove();
    });
</script>
{% endblock %}
