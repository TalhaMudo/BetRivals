{% extends "base.html" %}
{% block content %}
<style>
    .shots-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .shots-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .shots-header h2 {
        color: #2ecc71;
        font-size: 2em;
    }

    .btn-add {
        padding: 12px 25px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .btn-add:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, .3);
    }

    .filters-section {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }

    .filter-input {
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        padding: 10px;
        color: #fff;
        font-size: .95em;
    }

    .filter-input::placeholder {
        color: #888;
    }

    .shots-table {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        overflow: hidden;
        width: 100%;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: rgba(46, 204, 113, .1);
        border-bottom: 2px solid rgba(46, 204, 113, .3);
    }

    th {
        padding: 15px;
        text-align: left;
        color: #2ecc71;
        font-weight: 600;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid rgba(46, 204, 113, .1);
        color: #b8b8b8;
    }

    tbody tr:hover {
        background: rgba(46, 204, 113, .05);
    }

    .action-buttons {
        display: flex;
        gap: 8px;
    }

    .btn-edit,
    .btn-delete {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: .85em;
        transition: all .3s;
    }

    .btn-edit {
        background: rgba(52, 152, 219, .2);
        color: #3498db;
        border: 1px solid rgba(52, 152, 219, .5);
    }

    .btn-edit:hover {
        background: rgba(52, 152, 219, .3);
    }

    .btn-delete {
        background: rgba(231, 76, 60, .2);
        color: #ff6b6b;
        border: 1px solid rgba(231, 76, 60, .5);
    }

    .btn-delete:hover {
        background: rgba(231, 76, 60, .3);
    }

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, .7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: rgba(15, 20, 25, .98);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 15px;
        padding: 30px;
        width: 90%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(46, 204, 113, .2);
    }

    .modal-header h3 {
        color: #2ecc71;
        margin: 0;
    }

    .close-modal {
        background: none;
        border: none;
        color: #888;
        font-size: 1.5em;
        cursor: pointer;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-modal:hover {
        color: #fff;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #2ecc71;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
    }

    .form-buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .btn-submit,
    .btn-cancel {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .btn-submit {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, .3);
    }

    .btn-cancel {
        background: rgba(255, 255, 255, .1);
        color: #b8b8b8;
        border: 1px solid rgba(255, 255, 255, .2);
    }

    .btn-cancel:hover {
        background: rgba(255, 255, 255, .15);
    }

    .pagination-wrapper {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .page-btn {
        padding: 10px 16px;
        background: rgba(46, 204, 113, .1);
        border: 1px solid rgba(46, 204, 113, .3);
        color: #2ecc71;
        border-radius: 8px;
        cursor: pointer;
        transition: all .3s;
        font-weight: 600;
        font-size: .95em;
        min-width: 45px;
        text-align: center;
    }

    .page-btn:hover:not(.active):not(:disabled) {
        background: rgba(46, 204, 113, .2);
        transform: translateY(-2px);
    }

    .page-btn.active {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border-color: #2ecc71;
        box-shadow: 0 4px 12px rgba(46, 204, 113, .4);
    }

    .page-btn:disabled {
        opacity: .4;
        cursor: not-allowed;
    }

    .page-btn.nav-btn {
        font-weight: 700;
        padding: 10px 20px;
    }

    .page-btn.ellipsis {
        background: transparent;
        border: none;
        cursor: default;
        color: #888;
    }

    .pagination-info-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .pagination-info {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 15px 25px;
        color: #b8b8b8;
        font-size: .95em;
        flex: 1;
        min-width: 250px;
    }

    .pagination-info strong {
        color: #2ecc71;
        font-weight: 600;
    }

    .go-to-page {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .go-to-page label {
        color: #b8b8b8;
        font-weight: 600;
        white-space: nowrap;
    }

    .go-to-page input {
        width: 80px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        color: #fff;
        text-align: center;
    }

    .go-to-page button {
        padding: 8px 20px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .go-to-page button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(46, 204, 113, .4);
    }

    .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
    }

    .alert.show {
        display: block;
    }

    .alert-success {
        background: rgba(46, 204, 113, .1);
        border: 1px solid rgba(46, 204, 113, .3);
        color: #2ecc71;
    }

    .alert-error {
        background: rgba(231, 76, 60, .1);
        border: 1px solid rgba(231, 76, 60, .3);
        color: #ff6b6b;
    }

    .no-data {
        text-align: center;
        padding: 60px 20px;
        color: #888;
    }
</style>

<div class="shots-container">
    <div class="shots-header">
        <a style="text-decoration:none;" href="/admin">
            <p class="btn-add">Back to Admin</p>
        </a>
        <h2>🏆 Teams Management</h2>
        <button class="btn-add" onclick="openCreateModal()">+ Add Team</button>
    </div>

    <div id="alert" class="alert"></div>

    <div class="filters-section">
        <input type="text" class="filter-input" id="filterQ" placeholder="Search by team name..." onkeyup="loadTeams()">
        <button class="btn-add" onclick="loadTeams()">🔄 Refresh</button>
    </div>

    <div class="shots-table">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Team Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="teamsTableBody">
                    <tr>
                        <td colspan="3" class="no-data">Loading teams...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="pagination-wrapper">
        <div class="pagination" id="paginationContainer"></div>
        <div class="pagination-info-container">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="go-to-page">
                <label for="pageInput">Go to page:</label>
                <input type="number" id="pageInput" min="1" placeholder="Page #" onkeypress="handleGoToKeyPress(event)">
                <button onclick="goToInputPage()">Go</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="teamModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add New Team</h3>
            <button class="close-modal" onclick="closeModal()">×</button>
        </div>

        <form id="teamForm" onsubmit="saveTeamAction(event)">
            <div class="form-group">
                <label>Team Name *</label>
                <input type="text" id="team_name" required placeholder="e.g., Galatasaray">
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-submit" id="submitBtn">Add Team</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentPage = 1;
    let currentEditId = null;
    let lastTotal = 0;
    const limit = 20;

    function showAlert(message, type = 'success') {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.className = `alert show alert-${type}`;
        setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function openCreateModal() {
        currentEditId = null;
        document.getElementById('teamForm').reset();
        document.getElementById('modalTitle').textContent = 'Add New Team';
        document.getElementById('submitBtn').textContent = 'Add Team';
        document.getElementById('teamModal').classList.add('active');
    }

    function openEditModal(teamId) {
        fetch(`/api/admin/teams/${teamId}`)
            .then(res => {
                if (res.status === 401) { window.location.href = "/login"; return null; }
                return res.json();
            })
            .then(data => {
                if (!data) return;
                if (data.success) {
                    currentEditId = teamId;
                    document.getElementById('team_name').value = data.team.team_name;
                    document.getElementById('modalTitle').textContent = 'Edit Team';
                    document.getElementById('submitBtn').textContent = 'Update Team';
                    document.getElementById('teamModal').classList.add('active');
                } else {
                    showAlert(data.error || 'Failed to load team', 'error');
                }
            })
            .catch(() => showAlert('Error loading team', 'error'));
    }

    function closeModal() {
        document.getElementById('teamModal').classList.remove('active');
    }

    function saveTeamAction(event) {
        event.preventDefault();
        const payload = { team_name: document.getElementById('team_name').value.trim() };
        if (!payload.team_name) {
            showAlert('team_name is required', 'error');
            return;
        }

        const method = currentEditId ? 'PUT' : 'POST';
        const url = currentEditId ? `/api/admin/teams/${currentEditId}` : `/api/admin/teams`;

        fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert(data.message || 'Saved', 'success');
                    closeModal();
                    loadTeams(currentPage);
                } else {
                    showAlert(data.error || 'Save failed', 'error');
                }
            })
            .catch(() => showAlert('Error saving team', 'error'));
    }

    function deleteTeamAction(teamId) {
        if (!confirm('Are you sure you want to delete this team?')) return;
        fetch(`/api/admin/teams/${teamId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert(data.message || 'Deleted', 'success');
                    loadTeams(currentPage);
                } else {
                    showAlert(data.error || 'Delete failed (FK?)', 'error');
                }
            })
            .catch(() => showAlert('Error deleting team', 'error'));
    }

    function loadTeams(page = 1) {
        currentPage = page;
        const q = document.getElementById('filterQ').value.trim();
        const params = new URLSearchParams({ page, limit, q });

        fetch(`/api/admin/teams?${params}`)
            .then(res => {
                if (res.status === 401) { window.location.href = "/login"; return null; }
                return res.json();
            })
            .then(data => {
                if (!data) return;
                if (data.success) {
                    lastTotal = data.total || 0;
                    renderTable(data.teams);
                    renderPagination(lastTotal, data.limit || limit);
                }
            })
            .catch(() => showAlert('Error loading teams', 'error'));
    }

    function renderTable(teams) {
        const tbody = document.getElementById('teamsTableBody');
        if (!teams || teams.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="no-data">No teams found</td></tr>`;
            return;
        }
        tbody.innerHTML = teams.map(t => `
      <tr>
        <td>${t.team_id}</td>
        <td>${t.team_name}</td>
        <td>
          <div class="action-buttons">
            <button class="btn-edit" onclick="openEditModal(${t.team_id})">Edit</button>
            <button class="btn-delete" onclick="deleteTeamAction(${t.team_id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
    }

    function renderPagination(total, lim) {
        const totalPages = Math.ceil(total / lim) || 1;
        const container = document.getElementById('paginationContainer');
        const info = document.getElementById('paginationInfo');
        document.getElementById('pageInput').max = totalPages;

        const startItem = total === 0 ? 0 : ((currentPage - 1) * lim) + 1;
        const endItem = Math.min(currentPage * lim, total);

        info.innerHTML = `
      Showing <strong>${startItem.toLocaleString()}</strong> to
      <strong>${endItem.toLocaleString()}</strong> of
      <strong>${total.toLocaleString()}</strong> teams
      (Page <strong>${currentPage}</strong> of <strong>${totalPages.toLocaleString()}</strong>)
    `;

        let html = '';
        html += `<button class="page-btn nav-btn" onclick="loadTeams(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>`;

        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) html += createPageButton(i);
        } else {
            html += createPageButton(1);

            let startPage, endPage;
            if (currentPage <= 3) { startPage = 2; endPage = 5; }
            else if (currentPage >= totalPages - 2) { startPage = totalPages - 4; endPage = totalPages - 1; }
            else { startPage = currentPage - 1; endPage = currentPage + 1; }

            if (startPage > 2) html += `<button class="page-btn ellipsis" disabled>...</button>`;
            for (let i = startPage; i <= endPage; i++) html += createPageButton(i);
            if (endPage < totalPages - 1) html += `<button class="page-btn ellipsis" disabled>...</button>`;

            html += createPageButton(totalPages);
        }

        html += `<button class="page-btn nav-btn" onclick="loadTeams(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
        container.innerHTML = html;
    }

    function createPageButton(p) {
        return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="loadTeams(${p})">${p}</button>`;
    }

    function goToInputPage() {
        const v = parseInt(document.getElementById('pageInput').value);
        const totalPages = Math.ceil(lastTotal / limit) || 1;
        if (isNaN(v) || v < 1 || v > totalPages) {
            showAlert(`Page must be between 1 and ${totalPages}`, 'error');
            return;
        }
        loadTeams(v);
        document.getElementById('pageInput').value = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleGoToKeyPress(e) {
        if (e.key === 'Enter') goToInputPage();
    }

    loadTeams();
</script>
{% endblock %}
