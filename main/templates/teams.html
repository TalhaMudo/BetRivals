{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='teams_user.css') }}">
<script src="{{ url_for('static', filename='teams_user.js') }}" defer></script>

<div class="teams-page">

  <div class="hero-section">
    <h2>🏆 Teams</h2>
    <p>Browse football teams and explore their seasonal performance.</p>
  </div>

  <!-- Search + Filters -->
  <div class="filter-card">
    <div class="row">
      <input id="searchTeam" type="text" placeholder="Search by team name...">
      <button id="btnSearch">Search</button>
      <button id="btnReset" class="secondary">Reset</button>
      <button id="btnViewAll" class="outline">View All</button>
    </div>
  </div>

  <!-- Results -->
  <div id="teamsGrid" class="teams-grid"></div>

</div>

{% endblock %}
