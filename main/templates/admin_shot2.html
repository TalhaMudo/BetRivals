{% extends "base.html" %}

{% block content %}
<style>
    .shots-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .shots-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .shots-header h2 {
        color: #2ecc71;
        font-size: 2em;
    }

    .btn-add {
        padding: 12px 25px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-add:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, 0.3);
    }

    .filters-section {
        background: rgba(15, 20, 25, 0.95);
        border: 1px solid rgba(46, 204, 113, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 15px;
    }

    .filter-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
    }

    .filter-input {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(46, 204, 113, 0.3);
        border-radius: 6px;
        padding: 10px;
        color: #fff;
        font-size: 0.95em;
    }

    .filter-input::placeholder {
        color: #888;
    }

    .filter-label {
        color: #2ecc71;
        font-size: 0.85em;
        margin-bottom: 5px;
        display: block;
    }

    .shots-table {
        background: rgba(15, 20, 25, 0.95);
        border: 1px solid rgba(46, 204, 113, 0.2);
        border-radius: 12px;
        overflow: hidden;
        width: 100%;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: rgba(46, 204, 113, 0.1);
        border-bottom: 2px solid rgba(46, 204, 113, 0.3);
    }

    th {
        padding: 15px;
        text-align: left;
        color: #2ecc71;
        font-weight: 600;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid rgba(46, 204, 113, 0.1);
        color: #b8b8b8;
    }

    tbody tr:hover {
        background: rgba(46, 204, 113, 0.05);
    }

    .action-buttons {
        display: flex;
        gap: 8px;
    }

    .btn-edit, .btn-delete {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85em;
        transition: all 0.3s;
    }

    .btn-edit {
        background: rgba(52, 152, 219, 0.2);
        color: #3498db;
        border: 1px solid rgba(52, 152, 219, 0.5);
    }

    .btn-edit:hover {
        background: rgba(52, 152, 219, 0.3);
    }

    .btn-delete {
        background: rgba(231, 76, 60, 0.2);
        color: #ff6b6b;
        border: 1px solid rgba(231, 76, 60, 0.5);
    }

    .btn-delete:hover {
        background: rgba(231, 76, 60, 0.3);
    }

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: rgba(15, 20, 25, 0.98);
        border: 1px solid rgba(46, 204, 113, 0.3);
        border-radius: 15px;
        padding: 30px;
        width: 90%;
        max-width: 700px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(46, 204, 113, 0.2);
    }

    .modal-header h3 {
        color: #2ecc71;
        margin: 0;
    }

    .close-modal {
        background: none;
        border: none;
        color: #888;
        font-size: 1.5em;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-modal:hover {
        color: #fff;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group.full-width {
        grid-column: 1 / -1;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #2ecc71;
        font-weight: 600;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(46, 204, 113, 0.3);
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
    }

    .autocomplete-container {
        position: relative;
    }

    .autocomplete-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 20, 25, 0.98);
        border: 1px solid rgba(46, 204, 113, 0.3);
        border-top: none;
        border-radius: 0 0 6px 6px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }

    .autocomplete-results.show {
        display: block;
    }

    .autocomplete-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid rgba(46, 204, 113, 0.1);
        color: #b8b8b8;
    }

    .autocomplete-item:hover {
        background: rgba(46, 204, 113, 0.1);
    }

    .form-buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .btn-submit, .btn-cancel {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-submit {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, 0.3);
    }

    .btn-cancel {
        background: rgba(255, 255, 255, 0.1);
        color: #b8b8b8;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-cancel:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 30px;
    }

    .page-btn {
        padding: 8px 15px;
        background: rgba(46, 204, 113, 0.1);
        border: 1px solid rgba(46, 204, 113, 0.3);
        color: #2ecc71;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .page-btn:hover,
    .page-btn.active {
        background: rgba(46, 204, 113, 0.3);
    }

    .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
    }

    .alert.show {
        display: block;
    }

    .alert-success {
        background: rgba(46, 204, 113, 0.1);
        border: 1px solid rgba(46, 204, 113, 0.3);
        color: #2ecc71;
    }

    .alert-error {
        background: rgba(231, 76, 60, 0.1);
        border: 1px solid rgba(231, 76, 60, 0.3);
        color: #ff6b6b;
    }

    .no-data {
        text-align: center;
        padding: 60px 20px;
        color: #888;
    }

    .filter-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .btn-filter, .btn-clear {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-filter {
        background: rgba(52, 152, 219, 0.2);
        color: #3498db;
        border: 1px solid rgba(52, 152, 219, 0.5);
    }

    .btn-filter:hover {
        background: rgba(52, 152, 219, 0.3);
    }

    .btn-clear {
        background: rgba(255, 255, 255, 0.1);
        color: #b8b8b8;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-clear:hover {
        background: rgba(255, 255, 255, 0.15);
    }
</style>

<div class="shots-container">
    <div class="shots-header">
        <h2>⚽ Shots Management</h2>
        <button class="btn-add" onclick="openCreateModal()">+ Add Shot</button>
    </div>

    <div id="alert" class="alert"></div>

    <div class="filters-section">
        <h3 style="color: #2ecc71; margin-bottom: 20px;">🔍 Advanced Filters</h3>
        
        <div class="filters-grid">
            <div>
                <label class="filter-label">Player Name</label>
                <input type="text" class="filter-input" id="filterPlayer" placeholder="Search player...">
            </div>
            <div>
                <label class="filter-label">Team</label>
                <input type="text" class="filter-input" id="filterTeam" placeholder="Team name...">
            </div>
            <div>
                <label class="filter-label">Result</label>
                <select class="filter-input" id="filterResult">
                    <option value="">All Results</option>
                    <option value="Goal">Goal</option>
                    <option value="Off Target">Off Target</option>
                    <option value="On Target">On Target</option>
                    <option value="Blocked">Blocked</option>
                </select>
            </div>
            <div>
                <label class="filter-label">Shot Type</label>
                <select class="filter-input" id="filterShotType">
                    <option value="">All Types</option>
                </select>
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label class="filter-label">Season</label>
                <select class="filter-input" id="filterSeason">
                    <option value="">All Seasons</option>
                </select>
            </div>
            <div>
                <label class="filter-label">Situation</label>
                <select class="filter-input" id="filterSituation">
                    <option value="">All Situations</option>
                </select>
            </div>
            <div>
                <label class="filter-label">Home/Away</label>
                <select class="filter-input" id="filterHA">
                    <option value="">Both</option>
                    <option value="h">Home</option>
                    <option value="a">Away</option>
                </select>
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label class="filter-label">Min xG</label>
                <input type="number" class="filter-input" id="filterMinXG" placeholder="0.00" step="0.01" min="0" max="1">
            </div>
            <div>
                <label class="filter-label">Max xG</label>
                <input type="number" class="filter-input" id="filterMaxXG" placeholder="1.00" step="0.01" min="0" max="1">
            </div>
            <div>
                <label class="filter-label">Min Minute</label>
                <input type="number" class="filter-input" id="filterMinMinute" placeholder="0" min="0" max="120">
            </div>
            <div>
                <label class="filter-label">Max Minute</label>
                <input type="number" class="filter-input" id="filterMaxMinute" placeholder="120" min="0" max="120">
            </div>
        </div>

        <div class="filter-actions">
            <button class="btn-filter" onclick="loadShots()">🔍 Apply Filters</button>
            <button class="btn-clear" onclick="clearFilters()">✕ Clear Filters</button>
        </div>
    </div>

    <div class="shots-table">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Player</th>
                        <th>Match</th>
                        <th>Minute</th>
                        <th>Result</th>
                        <th>xG</th>
                        <th>Type</th>
                        <th>Situation</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="shotsTableBody">
                    <tr>
                        <td colspan="10" class="no-data">Loading shots...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="pagination" id="paginationContainer"></div>
</div>

<!-- Create/Edit Modal -->
<div id="shotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add New Shot</h3>
            <button class="close-modal" onclick="closeModal()">×</button>
        </div>
        <form id="shotForm" onsubmit="saveShotAction(event)">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Player Name *</label>
                    <div class="autocomplete-container">
                        <input type="text" id="player" required autocomplete="off" oninput="searchPlayers(this.value)">
                        <div id="playerAutocomplete" class="autocomplete-results"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Player ID *</label>
                    <input type="number" id="player_id" required readonly style="background: rgba(255,255,255,0.02);">
                </div>
                
                <div class="form-group">
                    <label>Match ID *</label>
                    <input type="number" id="match_id" required>
                </div>
                
                <div class="form-group">
                    <label>Minute *</label>
                    <input type="number" id="minute" required min="0" max="120">
                </div>
                
                <div class="form-group">
                    <label>Result *</label>
                    <select id="result" required>
                        <option value="">Select Result</option>
                        <option value="Goal">Goal</option>
                        <option value="Off Target">Off Target</option>
                        <option value="On Target">On Target</option>
                        <option value="Blocked">Blocked</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>xG * (0.00 - 1.00)</label>
                    <input type="number" id="xG" step="0.01" min="0" max="1" required oninput="validateDecimal(this)">
                </div>
                
                <div class="form-group">
                    <label>X Position</label>
                    <input type="number" id="X" step="0.01" oninput="validateDecimal(this)">
                </div>
                
                <div class="form-group">
                    <label>Y Position</label>
                    <input type="number" id="Y" step="0.01" oninput="validateDecimal(this)">
                </div>
                
                <div class="form-group">
                    <label>Shot Type</label>
                    <select id="shotType">
                        <option value="Open Play">Open Play</option>
                        <option value="Set Piece">Set Piece</option>
                        <option value="Counter Attack">Counter Attack</option>
                        <option value="Penalty">Penalty</option>
                        <option value="Free Kick">Free Kick</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Situation</label>
                    <select id="situation">
                        <option value="Regular">Regular</option>
                        <option value="Open Play">Open Play</option>
                        <option value="FromCorner">From Corner</option>
                        <option value="SetPiece">Set Piece</option>
                        <option value="DirectFreekick">Direct Free Kick</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Home Team *</label>
                    <input type="text" id="h_team" required>
                </div>
                
                <div class="form-group">
                    <label>Away Team *</label>
                    <input type="text" id="a_team" required>
                </div>
                
                <div class="form-group">
                    <label>Home/Away *</label>
                    <select id="h_a" required>
                        <option value="h">Home</option>
                        <option value="a">Away</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Season *</label>
                    <input type="number" id="season" required min="2014" max="2030">
                </div>
                
                <div class="form-group">
                    <label>Home Goals</label>
                    <input type="number" id="h_goals" min="0">
                </div>
                
                <div class="form-group">
                    <label>Away Goals</label>
                    <input type="number" id="a_goals" min="0">
                </div>
            </div>
            
            <div class="form-buttons">
                <button type="submit" class="btn-submit" id="submitBtn">Add Shot</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentPage = 1;
    let currentEditId = null;
    let playerSearchTimeout = null;

    // Validate decimal inputs to 2 places
    function validateDecimal(input) {
        const value = input.value;
        if (value && value.includes('.')) {
            const parts = value.split('.');
            if (parts[1] && parts[1].length > 2) {
                input.value = parseFloat(value).toFixed(2);
            }
        }
    }

    // Player autocomplete search
    function searchPlayers(query) {
        clearTimeout(playerSearchTimeout);
        const resultsDiv = document.getElementById('playerAutocomplete');
        
        if (query.length < 2) {
            resultsDiv.classList.remove('show');
            return;
        }

        playerSearchTimeout = setTimeout(() => {
            fetch(`/api/players/autocomplete?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(players => {
                    if (players.length === 0) {
                        resultsDiv.innerHTML = '<div class="autocomplete-item">No players found</div>';
                    } else {
                        resultsDiv.innerHTML = players.map(p => 
                            `<div class="autocomplete-item" onclick="selectPlayer('${p.player.replace(/'/g, "\\'")}', ${p.player_id})">
                                ${p.player} (ID: ${p.player_id})
                            </div>`
                        ).join('');
                    }
                    resultsDiv.classList.add('show');
                })
                .catch(err => console.error(err));
        }, 300);
    }

    function selectPlayer(name, id) {
        document.getElementById('player').value = name;
        document.getElementById('player_id').value = id;
        document.getElementById('playerAutocomplete').classList.remove('show');
    }

    // Close autocomplete when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.autocomplete-container')) {
            document.getElementById('playerAutocomplete').classList.remove('show');
        }
    });

    function showAlert(message, type = 'success') {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.className = `alert show alert-${type}`;
        setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function openCreateModal() {
        currentEditId = null;
        document.getElementById('shotForm').reset();
        document.getElementById('player_id').readOnly = false;
        document.getElementById('modalTitle').textContent = 'Add New Shot';
        document.getElementById('submitBtn').textContent = 'Add Shot';
        document.getElementById('shotModal').classList.add('active');
    }

    function openEditModal(shotId) {
        fetch(`/api/admin/shots/${shotId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const shot = data.shot;
                    currentEditId = shotId;
                    document.getElementById('player').value = shot.player;
                    document.getElementById('player_id').value = shot.player_id;
                    document.getElementById('match_id').value = shot.match_id;
                    document.getElementById('minute').value = shot.minute;
                    document.getElementById('result').value = shot.result;
                    document.getElementById('xG').value = parseFloat(shot.xG).toFixed(2);
                    document.getElementById('X').value = shot.X ? parseFloat(shot.X).toFixed(2) : '';
                    document.getElementById('Y').value = shot.Y ? parseFloat(shot.Y).toFixed(2) : '';
                    document.getElementById('shotType').value = shot.shotType || 'Open Play';
                    document.getElementById('situation').value = shot.situation || 'Regular';
                    document.getElementById('h_team').value = shot.h_team;
                    document.getElementById('a_team').value = shot.a_team;
                    document.getElementById('h_a').value = shot.h_a;
                    document.getElementById('season').value = shot.season;
                    document.getElementById('h_goals').value = shot.h_goals || '';
                    document.getElementById('a_goals').value = shot.a_goals || '';
                    
                    document.getElementById('player_id').readOnly = true;
                    document.getElementById('modalTitle').textContent = 'Edit Shot';
                    document.getElementById('submitBtn').textContent = 'Update Shot';
                    document.getElementById('shotModal').classList.add('active');
                }
            })
            .catch(err => showAlert('Error loading shot', 'error'));
    }

    function closeModal() {
        document.getElementById('shotModal').classList.remove('active');
        document.getElementById('playerAutocomplete').classList.remove('show');
    }

    function saveShotAction(event) {
        event.preventDefault();
        
        const formData = {
            player: document.getElementById('player').value,
            player_id: parseInt(document.getElementById('player_id').value),
            match_id: parseInt(document.getElementById('match_id').value),
            minute: parseInt(document.getElementById('minute').value),
            result: document.getElementById('result').value,
            xG: parseFloat(parseFloat(document.getElementById('xG').value).toFixed(2)),
            X: document.getElementById('X').value ? parseFloat(parseFloat(document.getElementById('X').value).toFixed(2)) : null,
            Y: document.getElementById('Y').value ? parseFloat(parseFloat(document.getElementById('Y').value).toFixed(2)) : null,
            shotType: document.getElementById('shotType').value,
            situation: document.getElementById('situation').value,
            h_team: document.getElementById('h_team').value,
            a_team: document.getElementById('a_team').value,
            h_a: document.getElementById('h_a').value,
            season: parseInt(document.getElementById('season').value),
            h_goals: document.getElementById('h_goals').value ? parseInt(document.getElementById('h_goals').value) : null,
            a_goals: document.getElementById('a_goals').value ? parseInt(document.getElementById('a_goals').value) : null
        };

        const method = currentEditId ? 'PUT' : 'POST';
        const url = currentEditId ? `/api/admin/shots/${currentEditId}` : '/api/admin/shots';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showAlert(data.message, 'success');
                closeModal();
                loadShots();
            } else {
                showAlert(data.error, 'error');
            }
        })
        .catch(err => showAlert('Error saving shot', 'error'));
    }

    function deleteShotAction(shotId) {
        if (confirm('Are you sure you want to delete this shot?')) {
            fetch(`/api/admin/shots/${shotId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showAlert(data.message, 'success');
                        loadShots();
                    } else {
                        showAlert(data.error, 'error');
                    }
                })
                .catch(err => showAlert('Error deleting shot', 'error'));
        }
    }

    function clearFilters() {
        document.getElementById('filterPlayer').value = '';
        document.getElementById('filterTeam').value = '';
        document.getElementById('filterResult').value = '';
        document.getElementById('filterShotType').value = '';
        document.getElementById('filterSeason').value = '';
        document.getElementById('filterSituation').value = '';
        document.getElementById('filterHA').value = '';
        document.getElementById('filterMinXG').value = '';
        document.getElementById('filterMaxXG').value = '';
        document.getElementById('filterMinMinute').value = '';
        document.getElementById('filterMaxMinute').value = '';
        loadShots();
    }

    function loadShots(page = 1) {
        currentPage = page;
        
        const params = new URLSearchParams({
            page: page,
            limit: 20,
            player: document.getElementById('filterPlayer').value,
            team: document.getElementById('filterTeam').value,
            result: document.getElementById('filterResult').value,
            shot_type: document.getElementById('filterShotType').value,
            season: document.getElementById('filterSeason').value,
            situation: document.getElementById('filterSituation').value,
            h_a: document.getElementById('filterHA').value,
            min_xg: document.getElementById('filterMinXG').value,
            max_xg: document.getElementById('filterMaxXG').value,
            min_minute: document.getElementById('filterMinMinute').value,
            max_minute: document.getElementById('filterMaxMinute').value
        });

        fetch(`/api/admin/shots?${params}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderTable(data.shots);
                    renderPagination(data.total, data.limit);
                }
            }).catch(err => {
                console.error('Error loading shots:', err);
                document.getElementById('shotsTableBody').innerHTML = 
                    '<tr><td colspan="10" class="no-data">Error loading shots. Please try again.</td></tr>';
            });
    }

    function renderTable(shots) {
        const tbody = document.getElementById('shotsTableBody');
        
        if (!shots || shots.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="no-data">No shots found</td></tr>';
            return;
        }

        tbody.innerHTML = shots.map(shot => `
            <tr>
                <td>${shot.shot_id}</td>
                <td>${shot.player}</td>
                <td>${shot.h_team} vs ${shot.a_team}</td>
                <td>${shot.minute}'</td>
                <td><span style="color: ${getResultColor(shot.result)}">${shot.result}</span></td>
                <td>${parseFloat(shot.xG).toFixed(2)}</td>
                <td>${shot.shotType || '-'}</td>
                <td>${shot.situation || '-'}</td>
                <td>${shot.date ? new Date(shot.date).toLocaleDateString() : '-'}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="openEditModal(${shot.shot_id})">Edit</button>
                        <button class="btn-delete" onclick="deleteShotAction(${shot.shot_id})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function getResultColor(result) {
        switch(result) {
            case 'Goal': return '#2ecc71';
            case 'On Target': return '#3498db';
            case 'Off Target': return '#f39c12';
            case 'Blocked': return '#95a5a6';
            default: return '#b8b8b8';
        }
    }

    function renderPagination(total, limit) {
        const totalPages = Math.ceil(total / limit);
        const container = document.getElementById('paginationContainer');
        
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';
        
        // Previous button
        if (currentPage > 1) {
            html += `<button class="page-btn" onclick="loadShots(${currentPage - 1})">← Previous</button>`;
        }

        // Page numbers
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);

        if (startPage > 1) {
            html += `<button class="page-btn" onclick="loadShots(1)">1</button>`;
            if (startPage > 2) {
                html += `<span style="color: #888; padding: 8px;">...</span>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="loadShots(${i})">${i}</button>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += `<span style="color: #888; padding: 8px;">...</span>`;
            }
            html += `<button class="page-btn" onclick="loadShots(${totalPages})">${totalPages}</button>`;
        }

        // Next button
        if (currentPage < totalPages) {
            html += `<button class="page-btn" onclick="loadShots(${currentPage + 1})">Next →</button>`;
        }

        container.innerHTML = html;
    }

    // Load filter options and initial data on page load
    document.addEventListener('DOMContentLoaded', () => {
        // Load filter options
        fetch('/api/filters/options')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Populate season filter
                    const seasonSelect = document.getElementById('filterSeason');
                    data.seasons.forEach(season => {
                        const option = document.createElement('option');
                        option.value = season;
                        option.textContent = season;
                        seasonSelect.appendChild(option);
                    });

                    // Populate shot type filter
                    const shotTypeSelect = document.getElementById('filterShotType');
                    data.shot_types.forEach(type => {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = type;
                        shotTypeSelect.appendChild(option);
                    });

                    // Populate situation filter
                    const situationSelect = document.getElementById('filterSituation');
                    data.situations.forEach(situation => {
                        const option = document.createElement('option');
                        option.value = situation;
                        option.textContent = situation;
                        situationSelect.appendChild(option);
                    });
                }
            })
            .catch(err => console.error('Error loading filter options:', err));

        // Load initial shots data
        loadShots();
    });
</script>

{% endblock %}
