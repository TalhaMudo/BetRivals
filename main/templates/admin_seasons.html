{% extends "admin.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Manage Seasons</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Team</th>
                <th>Title</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="seasons-table">
            {% for s in seasons %}
            <tr data-id="{{ s.seasonentryid }}">
                <td>{{ s.seasonentryid }}</td>
                <td>
                    <select class="form-select form-select-sm">
                        {% for t in teams %}
                        <option value="{{ t.team_id }}" {% if t.team_name==s.team_name %}selected{% endif %}>{{
                            t.team_name }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td><input class="form-control form-control-sm" value="{{ s.title }}" /></td>
                <td><input class="form-control form-control-sm" type="number" value="{{ s.year }}" /></td>
                <td>
                    <button class="btn btn-sm btn-success update-btn">Update</button>
                    <button class="btn btn-sm btn-danger delete-btn">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <hr>
    <h5>Add New Season</h5>
    <div class="row">
        <div class="col-md-3">
            <select id="team-id" class="form-select">
                {% for t in teams %}
                <option value="{{ t.team_id }}">{{ t.team_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <input id="title" class="form-control" placeholder="Title" />
        </div>
        <div class="col-md-3">
            <input id="year" class="form-control" type="number" placeholder="Year" />
        </div>
        <div class="col-md-3">
            <button id="add-season" class="btn btn-primary">Add</button>
        </div>
    </div>
</div>

<script>
    document.getElementById("add-season").onclick = async () => {
        const data = {
            team_id: document.getElementById("team-id").value,
            title: document.getElementById("title").value,
            year: document.getElementById("year").value
        };
        await fetch("/api/admin/seasons", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        location.reload();
    };

    document.querySelectorAll(".update-btn").forEach(btn => btn.onclick = async e => {
        const tr = e.target.closest("tr");
        const id = tr.dataset.id;
        const sel = tr.querySelector("select").value;
        const title = tr.querySelectorAll("input")[0].value;
        const year = tr.querySelectorAll("input")[1].value;
        await fetch(`/api/admin/seasons/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team_id: sel, title, year })
        });
        alert("Updated!");
    });

    document.querySelectorAll(".delete-btn").forEach(btn => btn.onclick = async e => {
        if (!confirm("Delete this season?")) return;
        const tr = e.target.closest("tr");
        const id = tr.dataset.id;
        await fetch(`/api/admin/seasons/${id}`, { method: "DELETE" });
        tr.remove();
    });
</script>
{% endblock %}
