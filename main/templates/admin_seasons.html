{% extends "base.html" %}
{% block content %}
<style>
    .shots-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .shots-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .shots-header h2 {
        color: #2ecc71;
        font-size: 2em;
    }

    .btn-add {
        padding: 12px 25px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .btn-add:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, .3);
    }

    .filters-section {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }

    .filter-input {
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        padding: 10px;
        color: #fff;
        font-size: .95em;
    }

    .filter-input::placeholder {
        color: #888;
    }

    .shots-table {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        overflow: hidden;
        width: 100%;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: rgba(46, 204, 113, .1);
        border-bottom: 2px solid rgba(46, 204, 113, .3);
    }

    th {
        padding: 15px;
        text-align: left;
        color: #2ecc71;
        font-weight: 600;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid rgba(46, 204, 113, .1);
        color: #b8b8b8;
    }

    tbody tr:hover {
        background: rgba(46, 204, 113, .05);
    }

    .action-buttons {
        display: flex;
        gap: 8px;
    }

    .btn-edit,
    .btn-delete {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: .85em;
        transition: all .3s;
    }

    .btn-edit {
        background: rgba(52, 152, 219, .2);
        color: #3498db;
        border: 1px solid rgba(52, 152, 219, .5);
    }

    .btn-edit:hover {
        background: rgba(52, 152, 219, .3);
    }

    .btn-delete {
        background: rgba(231, 76, 60, .2);
        color: #ff6b6b;
        border: 1px solid rgba(231, 76, 60, .5);
    }

    .btn-delete:hover {
        background: rgba(231, 76, 60, .3);
    }

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, .7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: rgba(15, 20, 25, .98);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 15px;
        padding: 30px;
        width: 90%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(46, 204, 113, .2);
    }

    .modal-header h3 {
        color: #2ecc71;
        margin: 0;
    }

    .close-modal {
        background: none;
        border: none;
        color: #888;
        font-size: 1.5em;
        cursor: pointer;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-modal:hover {
        color: #fff;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #2ecc71;
        font-weight: 600;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
    }

    .form-buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .btn-submit,
    .btn-cancel {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .btn-submit {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(46, 204, 113, .3);
    }

    .btn-cancel {
        background: rgba(255, 255, 255, .1);
        color: #b8b8b8;
        border: 1px solid rgba(255, 255, 255, .2);
    }

    .btn-cancel:hover {
        background: rgba(255, 255, 255, .15);
    }

    .pagination-wrapper {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .page-btn {
        padding: 10px 16px;
        background: rgba(46, 204, 113, .1);
        border: 1px solid rgba(46, 204, 113, .3);
        color: #2ecc71;
        border-radius: 8px;
        cursor: pointer;
        transition: all .3s;
        font-weight: 600;
        font-size: .95em;
        min-width: 45px;
        text-align: center;
    }

    .page-btn:hover:not(.active):not(:disabled) {
        background: rgba(46, 204, 113, .2);
        transform: translateY(-2px);
    }

    .page-btn.active {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border-color: #2ecc71;
        box-shadow: 0 4px 12px rgba(46, 204, 113, .4);
    }

    .page-btn:disabled {
        opacity: .4;
        cursor: not-allowed;
    }

    .page-btn.nav-btn {
        font-weight: 700;
        padding: 10px 20px;
    }

    .page-btn.ellipsis {
        background: transparent;
        border: none;
        cursor: default;
        color: #888;
    }

    .pagination-info-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .pagination-info {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 15px 25px;
        color: #b8b8b8;
        font-size: .95em;
        flex: 1;
        min-width: 250px;
    }

    .pagination-info strong {
        color: #2ecc71;
        font-weight: 600;
    }

    .go-to-page {
        background: rgba(15, 20, 25, .95);
        border: 1px solid rgba(46, 204, 113, .2);
        border-radius: 12px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .go-to-page label {
        color: #b8b8b8;
        font-weight: 600;
        white-space: nowrap;
    }

    .go-to-page input {
        width: 80px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, .05);
        border: 1px solid rgba(46, 204, 113, .3);
        border-radius: 6px;
        color: #fff;
        text-align: center;
    }

    .go-to-page button {
        padding: 8px 20px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #0f1419;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s;
    }

    .go-to-page button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(46, 204, 113, .4);
    }

    .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
    }

    .alert.show {
        display: block;
    }

    .alert-success {
        background: rgba(46, 204, 113, .1);
        border: 1px solid rgba(46, 204, 113, .3);
        color: #2ecc71;
    }

    .alert-error {
        background: rgba(231, 76, 60, .1);
        border: 1px solid rgba(231, 76, 60, .3);
        color: #ff6b6b;
    }

    .no-data {
        text-align: center;
        padding: 60px 20px;
        color: #888;
    }
</style>

<div class="shots-container">
    <div class="shots-header">
        <a style="text-decoration:none;" href="/admin">
            <p class="btn-add">Back to Admin</p>
        </a>
        <h2>📅 Seasons Management</h2>
        <button class="btn-add" onclick="openCreateModal()">+ Add Season</button>
    </div>

    <div id="alert" class="alert"></div>

    <div class="filters-section">
        <select class="filter-input" id="filterTeamId" onchange="loadSeasons()">
            <option value="">All Teams</option>
        </select>
        <input type="number" class="filter-input" id="filterYear" placeholder="Filter by year..."
            onkeyup="loadSeasons()">
        <input type="text" class="filter-input" id="filterTitle" placeholder="Filter by title..."
            onkeyup="loadSeasons()">
        <button class="btn-add" onclick="loadSeasons()">🔄 Refresh</button>
    </div>

    <div class="shots-table">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Team</th>
                        <th>Year</th>
                        <th>Title</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="seasonsTableBody">
                    <tr>
                        <td colspan="5" class="no-data">Loading seasons...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="pagination-wrapper">
        <div class="pagination" id="paginationContainer"></div>
        <div class="pagination-info-container">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="go-to-page">
                <label for="pageInput">Go to page:</label>
                <input type="number" id="pageInput" min="1" placeholder="Page #" onkeypress="handleGoToKeyPress(event)">
                <button onclick="goToInputPage()">Go</button>
            </div>
        </div>
    </div>
</div>

<div id="seasonModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add New Season</h3>
            <button class="close-modal" onclick="closeModal()">×</button>
        </div>

        <form id="seasonForm" onsubmit="saveSeasonAction(event)">
            <!-- ✅ Create'te görünsün, Edit'te gizlensin -->
            <div class="form-group" id="seasonentryidRow">
                <label>Season Entry ID *</label>
                <input type="number" id="seasonentryid" min="1" required placeholder="e.g., 7728">
            </div>

            <div class="form-group">
                <label>Team *</label>
                <select id="team_id" required></select>
            </div>

            <div class="form-group">
                <label>Year *</label>
                <input type="number" id="year" required placeholder="e.g., 2024">
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g., Premier League">
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-submit" id="submitBtn">Add Season</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentPage = 1;
    let currentEditId = null;
    let lastTotal = 0;
    const limit = 20;

    function showAlert(message, type = 'success') {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.className = `alert show alert-${type}`;
        setTimeout(() => alert.classList.remove('show'), 3000);
    }

    async function loadTeamsOptions() {
        const res = await fetch('/api/admin/teams/options');
        if (res.status === 401) { window.location.href = "/login"; return; }
        const data = await res.json();
        const selFilter = document.getElementById('filterTeamId');
        const selModal = document.getElementById('team_id');

        const teams = (data.success && data.teams) ? data.teams : [];
        selFilter.innerHTML = `<option value="">All Teams</option>` + teams.map(t =>
            `<option value="${t.team_id}">${t.team_name}</option>`
        ).join('');

        selModal.innerHTML = `<option value="" disabled selected>Select team...</option>` + teams.map(t =>
            `<option value="${t.team_id}">${t.team_name}</option>`
        ).join('');
    }

    function openCreateModal() {
        currentEditId = null;
        document.getElementById('seasonForm').reset();

        // ✅ ID görünür + required
        document.getElementById('seasonentryidRow').style.display = 'block';
        document.getElementById('seasonentryid').required = true;

        document.getElementById('modalTitle').textContent = 'Add New Season';
        document.getElementById('submitBtn').textContent = 'Add Season';
        document.getElementById('seasonModal').classList.add('active');
    }

    function openEditModal(id) {
        fetch(`/api/admin/seasons/${id}`)
            .then(res => { if (res.status === 401) { window.location.href = "/login"; return null; } return res.json(); })
            .then(data => {
                if (!data) return;
                if (data.success) {
                    currentEditId = id;

                    // ✅ Edit'te ID alanı gözükmesin
                    document.getElementById('seasonentryidRow').style.display = 'none';
                    document.getElementById('seasonentryid').required = false;

                    document.getElementById('team_id').value = data.season.team_id;
                    document.getElementById('year').value = data.season.year;
                    document.getElementById('title').value = data.season.title || '';
                    document.getElementById('modalTitle').textContent = 'Edit Season';
                    document.getElementById('submitBtn').textContent = 'Update Season';
                    document.getElementById('seasonModal').classList.add('active');
                } else {
                    showAlert(data.error || 'Failed to load season', 'error');
                }
            })
            .catch(() => showAlert('Error loading season', 'error'));
    }

    function closeModal() {
        document.getElementById('seasonModal').classList.remove('active');

        // modal kapatınca create’e dönünce tekrar düzgün gelsin diye:
        document.getElementById('seasonentryidRow').style.display = 'block';
        document.getElementById('seasonentryid').required = true;
    }

    function saveSeasonAction(e) {
        e.preventDefault();

        const teamId = document.getElementById('team_id').value;
        const year = document.getElementById('year').value;
        const title = document.getElementById('title').value.trim();

        const payload = { team_id: teamId, year, title };

        // ✅ sadece CREATE’te seasonentryid gönder
        if (!currentEditId) {
            const sid = document.getElementById('seasonentryid').value.trim();
            if (!sid) {
                showAlert('seasonentryid is required', 'error');
                return;
            }
            payload.seasonentryid = sid;
        }

        if (!payload.team_id || !payload.year) {
            showAlert('team_id and year are required', 'error');
            return;
        }

        const method = currentEditId ? 'PUT' : 'POST';
        const url = currentEditId ? `/api/admin/seasons/${currentEditId}` : `/api/admin/seasons`;

        fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert(data.message || 'Saved', 'success');
                    document.getElementById('seasonModal').classList.remove('active');
                    loadSeasons(currentPage);
                } else {
                    showAlert(data.error || 'Save failed', 'error');
                }
            })
            .catch(() => showAlert('Error saving season', 'error'));
    }

    function deleteSeasonAction(id) {
        if (!confirm('Are you sure you want to delete this season?')) return;
        fetch(`/api/admin/seasons/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert(data.message || 'Deleted', 'success');
                    loadSeasons(currentPage);
                } else {
                    showAlert(data.error || 'Delete failed', 'error');
                }
            })
            .catch(() => showAlert('Error deleting season', 'error'));
    }

    function loadSeasons(page = 1) {
        currentPage = page;
        const team_id = document.getElementById('filterTeamId').value;
        const year = document.getElementById('filterYear').value.trim();
        const title = document.getElementById('filterTitle').value.trim();

        const params = new URLSearchParams({ page, limit, team_id, year, title });

        fetch(`/api/admin/seasons?${params}`)
            .then(res => { if (res.status === 401) { window.location.href = "/login"; return null; } return res.json(); })
            .then(data => {
                if (!data) return;
                if (data.success) {
                    lastTotal = data.total || 0;
                    renderTable(data.seasons);
                    renderPagination(lastTotal, data.limit || limit);
                }
            })
            .catch(() => showAlert('Error loading seasons', 'error'));
    }

    function renderTable(rows) {
        const tbody = document.getElementById('seasonsTableBody');
        if (!rows || rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="no-data">No seasons found</td></tr>`;
            return;
        }
        tbody.innerHTML = rows.map(s => `
            <tr>
                <td>${s.seasonentryid}</td>
                <td>${s.team_name || '-'}</td>
                <td>${s.year ?? '-'}</td>
                <td>${s.title || '-'}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="openEditModal(${s.seasonentryid})">Edit</button>
                        <button class="btn-delete" onclick="deleteSeasonAction(${s.seasonentryid})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderPagination(total, lim) {
        const totalPages = Math.ceil(total / lim) || 1;
        const container = document.getElementById('paginationContainer');
        const info = document.getElementById('paginationInfo');
        document.getElementById('pageInput').max = totalPages;

        const startItem = total === 0 ? 0 : ((currentPage - 1) * lim) + 1;
        const endItem = Math.min(currentPage * lim, total);

        info.innerHTML = `
            Showing <strong>${startItem.toLocaleString()}</strong> to
            <strong>${endItem.toLocaleString()}</strong> of
            <strong>${total.toLocaleString()}</strong> seasons
            (Page <strong>${currentPage}</strong> of <strong>${totalPages.toLocaleString()}</strong>)
        `;

        let html = '';
        html += `<button class="page-btn nav-btn" onclick="loadSeasons(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>`;

        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) html += createPageButton(i);
        } else {
            html += createPageButton(1);

            let startPage, endPage;
            if (currentPage <= 3) { startPage = 2; endPage = 5; }
            else if (currentPage >= totalPages - 2) { startPage = totalPages - 4; endPage = totalPages - 1; }
            else { startPage = currentPage - 1; endPage = currentPage + 1; }

            if (startPage > 2) html += `<button class="page-btn ellipsis" disabled>...</button>`;
            for (let i = startPage; i <= endPage; i++) html += createPageButton(i);
            if (endPage < totalPages - 1) html += `<button class="page-btn ellipsis" disabled>...</button>`;

            html += createPageButton(totalPages);
        }

        html += `<button class="page-btn nav-btn" onclick="loadSeasons(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
        container.innerHTML = html;
    }

    function createPageButton(p) {
        return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="loadSeasons(${p})">${p}</button>`;
    }

    function goToInputPage() {
        const v = parseInt(document.getElementById('pageInput').value);
        const totalPages = Math.ceil(lastTotal / limit) || 1;
        if (isNaN(v) || v < 1 || v > totalPages) {
            showAlert(`Page must be between 1 and ${totalPages}`, 'error');
            return;
        }
        loadSeasons(v);
        document.getElementById('pageInput').value = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleGoToKeyPress(e) { if (e.key === 'Enter') goToInputPage(); }

    (async function init() {
        await loadTeamsOptions();
        loadSeasons();
    })();
</script>
{% endblock %}
