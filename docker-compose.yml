services:
  mysql:
    image: mysql:8.0
    container_name: osman_betrivals_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: betrivals
      MYSQL_USER: betrivals_user
      MYSQL_PASSWORD: betrivals_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./csv_files:/csv_files
    healthcheck:
      # We use 'mysqladmin ping' but increase the start_period
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootroot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s  # Gives MySQL 30 seconds to initialize before checking health
    networks:
      - betrivals_network

  flask_app:
    build: .
    container_name: osman_betrivals_flask
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootroot
      MYSQL_DB: betrivals
      MYSQL_PORT: 3306
      FLASK_ENV: production
    ports:
      - "5031:5000"
    volumes:
      - ./csv_files:/app/csv_files
      - ./.env:/app/.env
    networks:
      - betrivals_network
    # Removed the 'sleep 10' since healthcheck handles it now
    command: >
      sh -c "
        python kickstarter.py &&
        gunicorn app:app --workers=4 --threads=4 --bind=0.0.0.0:5000
      "

volumes:
  mysql_data:
    driver: local

networks:
  betrivals_network:
    driver: bridge